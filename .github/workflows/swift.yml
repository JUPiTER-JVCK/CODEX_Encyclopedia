name: Swift

# The compile gate. Without this, "does the macOS app build?" can only be
# answered by hand on a Mac — which means in practice it goes unanswered and
# unbuildable code reaches main. Public repos get free macOS runners, so
# there is no reason for this to be a manual step.

# No path filters. A required status check that never runs leaves a pull
# request permanently unmergeable, so every workflow runs on every PR — the
# few seconds spent building Swift on a docs-only change is worth far less
# than a merge that can never complete.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # SwiftPM's build directory is the expensive part of a cold run.
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: Codex_macOS/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Codex_macOS/Package.swift') }}-${{ hashFiles('Codex_macOS/Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Codex_macOS/Package.swift') }}-
            swiftpm-${{ runner.os }}-

      - name: Build (debug)
        working-directory: Codex_macOS
        run: swift build

      # Release catches a handful of things debug does not — dead-code paths
      # the optimizer reaches, and any @inlinable/availability mistakes.
      - name: Build (release)
        working-directory: Codex_macOS
        run: swift build -c release

      # Version.swift is the marketing-version SSOT; the committed Info.plist
      # must agree so a hand edit of only one side cannot ship again.
      - name: Version.swift matches Info.plist
        working-directory: Codex_macOS
        run: |
          set -euo pipefail
          V=$(sed -n 's/^[[:space:]]*static let version = "\([^"]*\)".*/\1/p' Sources/Codex/Version.swift | head -n 1)
          P=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "Version.swift=$V Info.plist=$P"
          test -n "$V"
          test "$V" = "$P"

      # Stage 10 wrote lipo -output onto .build/$CONFIG/Codex (a SwiftPM
      # symlink to an input slice). Guard the script text so that regression
      # fails CI even when we skip the dual-arch build below.
      - name: Guard lipo output path
        working-directory: Codex_macOS
        run: |
          set -euo pipefail
          univ=$(awk '/if \[ "\$DO_UNIVERSAL" = true \]; then/,/^else$/' package_app.sh)
          echo "$univ" | grep -q 'EXE=.*universal-\$CONFIG'
          if echo "$univ" | grep -qE 'EXE="\$PKG_DIR/\.build/\$CONFIG/Codex"'; then
            echo "✘ lipo -output must not be .build/\$CONFIG/Codex (SwiftPM symlink)" >&2
            exit 1
          fi

      # Cheapest packaging exercise on hosted runners: host-arch only, debug,
      # no secrets. Still copies Info.plist, stamps the version, codesigns,
      # and would have caught a broken package_app.sh entrypoint. Full
      # universal lipo stays a local/release concern; the guard above covers
      # the symlink failure mode in the script itself.
      #
      # bash, not ./ — package_app.sh is tracked without the executable bit
      # (100644), so ./ fails with Permission denied on hosted runners.
      - name: Package app (single-arch)
        working-directory: Codex_macOS
        run: bash package_app.sh --no-universal --debug
